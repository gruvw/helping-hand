[package]
name = "helping-hand"
version = "0.1.0"
authors = ["gruvw <gruvw.dev@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "helping-hand"
path = "src/main.rs"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys.git" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc.git" }

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.2" }

[dependencies]
log = "0.4"
anyhow = "1.0"
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync", "std", "alloc", "embedded-storage"] }
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
pwm-pca9685 = "1.0.0"
esp-idf-hal = "0.46.2"
embedded-hal = "1.0.0"
const_format = "0.2"

[build-dependencies]
dotenvy = "0.15"
embuild = "0.33"
