name: helping_hand
description: "Accessible home automation."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.1

dependency_overrides:
  analyzer: ^10.0.0

dependencies:
  flutter:
    sdk: flutter

  # language
  collection: ^1.19.0

  # ui
  gap: ^3.0.1
  material_symbols_icons: ^4.2815.0

  # state
  go_router: ^17.2.0
  flutter_hooks: ^0.21.3+1 
  hooks_riverpod: 
    git:
      url: https://github.com/rrousselGit/riverpod
      path: packages/hooks_riverpod
      ref: 0eb7d77

  # persistence
  drift: ^2.32.1
  drift_flutter: ^0.3.0

  # native
  path_provider: ^2.1.5
  flutter_native_splash: ^2.4.6
  http: ^1.6.0
  flutter_reorderable_grid_view: ^5.6.0

dev_dependencies:
  # testing
  flutter_test:
    sdk: flutter

  # build
  build_runner: ^2.13.1
  drift_dev: ^2.32.1

  # lints
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.3

  # command to set the application name:
  # `dart run change_app_package_name:main com.gruvw.helping_hand`
  change_app_package_name: ^1.5.0
  freezed: ^3.2.3

flutter:
  generate: true
  uses-material-design: true

# command to generate the icons: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  image_path: assets/logo/helping-hand.png
  android: true
  web:
    generate: true

# command to generate the splash screen: `dart run flutter_native_splash:create`
flutter_native_splash:
  android: true
  ios: true
  web: true
  color: "#FFFFFF"
  image: assets/logo/helping-hand.png
  android_12:
    color: "#FFFFFF"
